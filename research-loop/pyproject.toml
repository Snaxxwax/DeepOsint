[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-loop"
version = "0.1.0"
description = "Deterministic research loop: audited, graded, cited and file-backed"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
llm = ["anthropic"]
html = ["trafilatura"]

[project.scripts]
rloop = "rloop.cli:main"
